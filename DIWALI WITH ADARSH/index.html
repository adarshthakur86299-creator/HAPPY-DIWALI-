<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090e20">
  <title>Shubh Deepawali ✨</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Noto Sans Devanagari", sans-serif;
      --gold: #ffe3a1;
      --rose: #ffc0bb;
      --cream: #fff5df;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      place-items: center;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 100%, #87314d80, transparent 48%),
        radial-gradient(ellipse at 50% 0%, #27407075, transparent 50%),
        #090e20;
    }

    .stars {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #fff1c8;
      box-shadow: 0 0 9px 2px #ffd87999;
      animation: twinkle var(--time) ease-in-out var(--delay) infinite alternate;
    }

    .stage {
      position: fixed;
      z-index: 1;
      inset: 0;
      display: grid;
      padding: 14px;
      place-items: center;
      pointer-events: none;
    }

    .card {
      position: relative;
      width: min(100%, 440px);
      height: min(820px, calc(100svh - 28px));
      min-height: 500px;
      overflow: hidden;
      border: 1px solid #f5d28c80;
      border-radius: 28px;
      background:
        radial-gradient(ellipse at 50% 35%, #52274270, transparent 55%),
        linear-gradient(160deg, #0d1428, #15152c 64%, #25182d);
      box-shadow: 0 24px 80px #0009, inset 0 0 50px #ffc66a0c;
      perspective: 1300px;
      pointer-events: auto;
      animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before, .card::after {
      position: absolute;
      z-index: 2;
      inset: 10px;
      border: 1px solid #f5d28c38;
      border-radius: 21px;
      content: "";
      pointer-events: none;
    }

    .card::after { inset: 17px; border-color: #ff9a8222; border-radius: 16px; }

    .creator-tag {
      position: absolute;
      z-index: 6;
      top: 24px;
      left: 24px;
      display: grid;
      gap: 3px;
      padding: 8px 11px 8px 13px;
      border: 1px solid #ffdc9366;
      border-left: 3px solid #ffd98a;
      border-radius: 3px 12px 12px 3px;
      background: linear-gradient(110deg, #171a2bd9, #241a2ac9);
      box-shadow: 0 4px 16px #0005, inset 0 0 16px #ffdc9310;
      pointer-events: none;
      transform: skewX(-5deg);
    }

    .creator-tag span, .creator-tag strong { transform: skewX(5deg); }

    .creator-tag span {
      color: #ffe8bd;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .creator-tag strong {
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      text-shadow: 0 0 12px #ffc45a80;
    }

    .inside {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(42px, 8vh, 68px) 25px 28px;
      opacity: 0;
      visibility: hidden;
      transition: opacity .55s ease .25s, visibility 0s linear .8s;
      text-align: center;
    }

    .card.open .inside { opacity: 1; visibility: visible; transition-delay: .35s, 0s; }

    .canvas {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .topline, .message, .lamp, .signature { position: relative; z-index: 1; }

    .topline {
      margin: 0;
      color: var(--gold);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .message { width: 100%; margin: auto 0; padding: 20px 0; }

    .message-kicker {
      margin: 0 0 12px;
      color: #f0c4ae;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 4vw, 19px);
      font-style: italic;
      letter-spacing: .05em;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-family: "Noto Serif Devanagari", "Nirmala UI", "Kohinoor Devanagari", serif;
      font-size: clamp(43px, 12vw, 67px);
      font-weight: 750;
      line-height: 1.45;
      text-shadow: 0 0 13px #ffc060bd, 0 0 38px #ff8c4380;
    }

    .card.open h1 { animation: title-arrive .95s .42s both; }

    .ornament {
      margin: 8px 0 14px;
      color: #ffdc94;
      font-size: 13px;
      letter-spacing: .65em;
    }

    .wish {
      max-width: 330px;
      margin: 0 auto;
      color: #fff2df;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 4.1vw, 19px);
      line-height: 1.62;
    }

    .wish-hindi {
      display: block;
      margin-top: 12px;
      color: var(--rose);
      font-family: "Noto Sans Devanagari", "Nirmala UI", "Segoe UI", sans-serif;
      font-size: clamp(16px, 4.4vw, 20px);
      font-weight: 650;
      line-height: 1.6;
    }

    .lamp {
      position: relative;
      display: grid;
      width: 190px;
      height: 145px;
      flex: 0 0 auto;
      place-items: end center;
    }

    .lamp-glow {
      position: absolute;
      bottom: 8px;
      width: 180px;
      height: 65px;
      border-radius: 50%;
      background: #ff642f40;
      filter: blur(20px);
      animation: glow 1.8s ease-in-out infinite alternate;
    }

    .flame {
      position: absolute;
      z-index: 2;
      bottom: 66px;
      left: 50%;
      width: 26px;
      height: 51px;
      border-radius: 80% 10% 70% 40%;
      background: radial-gradient(ellipse at 67% 72%, #fffbdc 0 12%, #ffe889 24%, #ff9e38 66%, #fa533d);
      box-shadow: 0 0 20px 8px #ff9b3480, 0 0 46px 15px #ff663e38;
      transform: translateX(-50%) rotate(45deg);
      transform-origin: 50% 85%;
      animation: flame .7s ease-in-out infinite alternate;
    }

    .bowl {
      position: relative;
      z-index: 1;
      width: 122px;
      height: 49px;
      border: 2px solid #ffdb86;
      border-top-width: 4px;
      background: linear-gradient(180deg, #d94f48, #8e2948 68%, #3b1937);
      box-shadow: inset 0 8px 9px #ffb34e9c, 0 8px 18px #0008, 0 0 24px #ff984860;
      clip-path: polygon(0 0, 100% 0, 87% 68%, 66% 100%, 34% 100%, 13% 68%);
    }

    .signature {
      margin: 14px 0 0;
      color: #ffe0ad;
      font: italic 12px Georgia, "Times New Roman", serif;
      letter-spacing: .07em;
    }

    .cover {
      position: absolute;
      z-index: 4;
      inset: 0;
      display: grid;
      padding: 30px 22px;
      border: 0;
      border-radius: inherit;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 43%, #75402b80, transparent 38%),
        radial-gradient(ellipse at 50% 100%, #762d43, transparent 55%),
        linear-gradient(145deg, #101b32, #25172f 62%, #10172b);
      cursor: pointer;
      place-items: center;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.15s cubic-bezier(.2,.82,.18,1);
      backface-visibility: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .cover::before, .cover::after {
      position: absolute;
      inset: 10px;
      border: 1px solid #f5d28c73;
      border-radius: 21px;
      content: "";
      pointer-events: none;
    }

    .cover::after { inset: 17px; border-color: #ff9a8242; border-radius: 16px; }

    .cover-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .seal {
      display: grid;
      width: 104px;
      height: 104px;
      border: 1px solid #ffdc9380;
      border-radius: 50%;
      background: radial-gradient(circle, #ffdb8d20, transparent 68%);
      box-shadow: 0 0 36px #ffae4924, inset 0 0 22px #ffcd7317;
      font-size: 47px;
      place-items: center;
      animation: glow 2.4s ease-in-out infinite alternate;
    }

    .cover-title {
      margin: 0;
      color: var(--gold);
      font-family: "Noto Serif Devanagari", "Nirmala UI", serif;
      font-size: clamp(34px, 10vw, 49px);
      font-weight: 750;
      text-shadow: 0 0 18px #ffbd6480;
    }

    .cover-subtitle {
      margin: -4px 0 0;
      color: #f2d5b3;
      font: italic 15px Georgia, "Times New Roman", serif;
    }

    .tap {
      margin-top: 15px;
      padding: 12px 19px;
      border: 1px solid #ffdfa080;
      border-radius: 999px;
      color: #fff0cf;
      background: #fff3d30d;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .2em;
      text-transform: uppercase;
      animation: tap 1.8s ease-in-out infinite;
    }

    .card.open .cover {
      pointer-events: none;
      transform: rotateY(-178deg);
    }

    .controls {
      position: fixed;
      z-index: 5;
      inset: max(14px, env(safe-area-inset-top)) 14px auto;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .control {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid #ffe2aa70;
      border-radius: 999px;
      color: #fff1d2;
      background: #12172bd9;
      font: 700 12px "Segoe UI", sans-serif;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }

    .music-retry {
      max-width: 100%;
      border-color: #ffe2aa99;
      background: #25182feF;
    }

    .audio-actions {
      position: fixed;
      z-index: 6;
      right: 12px;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
    }

    .gift-dialog {
      max-width: calc(100vw - 32px);
      padding: 18px;
      border: 1px solid #ffe2aa99;
      border-radius: 20px;
      color: var(--cream);
      background: linear-gradient(145deg, #12172b, #25172f);
      box-shadow: 0 24px 80px #000b;
      text-align: center;
    }

    .gift-dialog::backdrop { background: #050817c9; }

    .gift-dialog h2 {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: 16px;
    }

    .gift-video {
      display: block;
      width: min(220px, calc(100vw - 72px));
      aspect-ratio: 1;
      margin: 0 auto 14px;
      border: 1px solid #ffe2aa70;
      border-radius: 12px;
      background: #090e20;
      object-fit: cover;
    }

    .gift-dialog .control { display: block; margin: 0 auto; }

    .control:focus-visible, .cover:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    [hidden] { display: none !important; }

    @keyframes twinkle { from { opacity: .18; } to { opacity: .95; } }
    @keyframes arrive { from { opacity: 0; transform: translateY(15px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes title-arrive {
      0% { opacity: 0; filter: blur(12px); transform: translateY(20px) scale(.8); }
      65% { opacity: 1; filter: blur(0); transform: translateY(-4px) scale(1.04); }
      100% { transform: none; }
    }
    @keyframes flame { from { scale: .9 1.05; rotate: -5deg; } to { scale: 1.08 .94; rotate: 5deg; } }
    @keyframes glow { from { opacity: .65; } to { opacity: 1; } }
    @keyframes tap { 0%, 100% { opacity: .75; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

    @media (max-width: 360px) {
      .stage { padding: 10px; }
      .card { height: calc(100svh - 20px); min-height: 0; border-radius: 23px; }
      .cover-content { gap: 14px; }
      .seal { width: 86px; height: 86px; font-size: 39px; }
      .tap { margin-top: 10px; padding: 10px 15px; font-size: 10px; }
      .inside { padding-right: 14px; padding-left: 14px; }
      .wish { font-size: 14px; }
      .wish-hindi { font-size: 15px; }
    }

    @media (max-height: 600px) {
      .card { min-height: 0; }
      .inside { padding: 32px 20px 12px; }
      .message { padding: 2px 0; }
      .message-kicker { margin-bottom: 3px; font-size: 14px; }
      h1 { font-size: clamp(32px, 10vh, 43px); line-height: 1.2; }
      .ornament { margin: 2px 0 4px; }
      .wish { font-size: 13px; line-height: 1.3; }
      .wish-hindi { margin-top: 3px; font-size: 14px; line-height: 1.3; }
      .lamp { height: 74px; transform: scale(.68); transform-origin: bottom center; }
      .signature { margin-top: 2px; font-size: 10px; }
    }

    @media (max-width: 360px) and (max-height: 600px) {
      .inside { padding: 26px 13px 10px; }
      .topline { font-size: 9px; }
      .message { padding: 0; }
      .message-kicker { font-size: 13px; }
      h1 { font-size: 35px; }
      .wish { font-size: 12px; }
      .wish-hindi { font-size: 13px; }
      .lamp { height: 65px; transform: scale(.6); }
      .signature { margin-top: 2px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .cover { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="stage">
    <main class="card" id="card">
      <div class="creator-tag" aria-label="Created by Adarsh Rajput">
        <span>Created by</span>
        <strong>Adarsh Rajput</strong>
      </div>
      <div class="inside" id="inside" inert>
        <canvas class="canvas" id="fireworks" aria-hidden="true"></canvas>
        <section class="message" aria-labelledby="greeting">
          <p class="message-kicker">Iss Diwali, ek nayi dua...</p>
          <h1 id="greeting" lang="hi">शुभ दीपावली</h1>
          <p class="ornament" aria-hidden="true">✦ ✧ ✦</p>
          <p class="wish">
            <span class="wish-hindi" lang="hi">राठौड़ परिवार की ओर से दीपावली की हार्दिक हार्दिक शुभकामनाएँ!</span>
          </p>
        </section>
        <div class="lamp" aria-hidden="true">
          <div class="lamp-glow"></div>
          <div class="flame"></div>
          <div class="bowl"></div>
        </div>
        <p class="signature">राठौड़ परिवार की ओर से ✨</p>
      </div>
      <button class="cover" id="cover" type="button" aria-controls="inside" aria-expanded="false">
        <span class="cover-content">
          <span class="seal" aria-hidden="true">🪔</span>
          <span class="cover-title" lang="hi">शुभ दीपावली</span>
          <span class="cover-subtitle">A little light, just for you</span>
          <span class="tap">✦ Tap to open ✦</span>
        </span>
      </button>
    </main>
  </div>

  <div class="controls">
    <button class="control" id="close" type="button" hidden>← Close card</button>
    <button class="control" id="again" type="button" hidden>✨ Celebrate again</button>
  </div>
  <div class="audio-actions" aria-label="Audio and gift controls">
    <button class="control" id="stop-song" type="button" hidden>⏹ Stop Old Song</button>
    <button class="control" id="open-gift" type="button" aria-haspopup="dialog" aria-controls="gift-dialog" hidden>🎁 Gift</button>
    <button class="control music-retry" id="music-retry" type="button" hidden>▶ Play Diwali audio</button>
  </div>
  <dialog class="gift-dialog" id="gift-dialog" aria-labelledby="gift-title">
    <h2 id="gift-title">A little Diwali gift ✨</h2>
    <video class="gift-video" id="gift-video" controls playsinline preload="metadata" aria-label="Diwali gift video">
      <source src="gift-video.mp4" type="video/mp4">
      Your browser does not support MP4 video.
    </video>
    <button class="control" id="close-gift" type="button">Close gift</button>
  </dialog>
  <audio id="diwali-audio" preload="auto" src="diwali-audio.mp3"></audio>

  <script>
    (() => {
      const card = document.getElementById("card");
      const cover = document.getElementById("cover");
      const inside = document.getElementById("inside");
      const close = document.getElementById("close");
      const again = document.getElementById("again");
      const audio = document.getElementById("diwali-audio");
      const musicRetry = document.getElementById("music-retry");
      const stopSong = document.getElementById("stop-song");
      const openGift = document.getElementById("open-gift");
      const giftDialog = document.getElementById("gift-dialog");
      const giftVideo = document.getElementById("gift-video");
      const closeGift = document.getElementById("close-gift");
      const canvas = document.getElementById("fireworks");
      const context = canvas.getContext("2d");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const particles = [];
      const rockets = [];
      const launchDelays = [];
      let frame = 0;
      let timer = 0;
      let lastTime = 0;
      let ratio = 1;

      if (!context) throw new Error("Canvas is unavailable; greeting fireworks cannot start.");

      for (let i = 0; i < 54; i += 1) {
        const star = document.createElement("i");
        star.className = "star";
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.setProperty("--size", `${1 + Math.random() * 2}px`);
        star.style.setProperty("--time", `${1.5 + Math.random() * 2}s`);
        star.style.setProperty("--delay", `${Math.random() * -4}s`);
        document.getElementById("stars").append(star);
      }

      function resizeCanvas() {
        const bounds = card.getBoundingClientRect();
        ratio = Math.min(window.devicePixelRatio || 1, window.innerWidth < 480 ? 1.5 : 2);
        canvas.width = Math.round(bounds.width * ratio);
        canvas.height = Math.round(bounds.height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function burst(x, y, amount = 1) {
        const count = Math.round((window.innerWidth < 480 ? 56 : 82) * amount);
        const hue = [42, 15, 350, 195, 270][Math.floor(Math.random() * 5)];
        const start = Math.random() * Math.PI * 2;
        for (let i = 0; i < count; i += 1) {
          const angle = start + Math.PI * 2 * i / count + (Math.random() - .5) * .08;
          const speed = 55 + Math.random() * 200;
          const life = .75 + Math.random() * .75;
          particles.push({
            x, y, px: x, py: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life, remaining: life,
            size: .8 + Math.random() * 2,
            hue,
            glitter: Math.random() > .78
          });
        }
      }

      function launchRocket() {
        const width = card.clientWidth;
        const height = card.clientHeight;
        const x = width * (.16 + Math.random() * .68);
        const y = height * (1.04 + Math.random() * .08);
        const targetX = Math.max(width * .12, Math.min(width * .88, x + (Math.random() - .5) * width * .26));
        const targetY = height * (.13 + Math.random() * .31);

        if (reducedMotion.matches) {
          burst(targetX, targetY, .75);
          return;
        }

        rockets.push({
          x, y, previousX: x, previousY: y,
          startX: x, startY: y, targetX, targetY,
          duration: .78 + Math.random() * .42,
          elapsed: 0,
          trailElapsed: 0,
          hue: [42, 18, 350, 195][Math.floor(Math.random() * 4)]
        });
      }

      function clearLaunchDelays() {
        for (const delay of launchDelays) window.clearTimeout(delay);
        launchDelays.length = 0;
      }

      function queueRocket(delay) {
        const delayId = window.setTimeout(() => {
          const index = launchDelays.indexOf(delayId);
          if (index !== -1) launchDelays.splice(index, 1);
          if (card.classList.contains("open")) launchRocket();
        }, delay);
        launchDelays.push(delayId);
      }

      function animate(now) {
        if (!card.classList.contains("open") || document.hidden) { frame = 0; return; }
        const bounds = card.getBoundingClientRect();
        const delta = Math.min((now - (lastTime || now)) / 1000, .033);
        lastTime = now;
        context.clearRect(0, 0, bounds.width, bounds.height);
        context.globalCompositeOperation = "lighter";

        for (let i = rockets.length - 1; i >= 0; i -= 1) {
          const rocket = rockets[i];
          rocket.previousX = rocket.x;
          rocket.previousY = rocket.y;
          rocket.elapsed += delta;
          rocket.trailElapsed += delta;
          const progress = Math.min(1, rocket.elapsed / rocket.duration);
          const eased = 1 - (1 - progress) * (1 - progress);
          rocket.x = rocket.startX + (rocket.targetX - rocket.startX) * eased;
          rocket.y = rocket.startY + (rocket.targetY - rocket.startY) * eased;

          context.beginPath();
          const trail = context.createLinearGradient(rocket.previousX, rocket.previousY, rocket.x, rocket.y);
          trail.addColorStop(0, `hsla(${rocket.hue} 100% 65% / .05)`);
          trail.addColorStop(1, `hsla(${rocket.hue} 100% 82% / .95)`);
          context.strokeStyle = trail;
          context.lineWidth = 3;
          context.lineCap = "round";
          context.shadowColor = `hsl(${rocket.hue} 100% 68%)`;
          context.shadowBlur = 14;
          context.moveTo(rocket.previousX, rocket.previousY);
          context.lineTo(rocket.x, rocket.y);
          context.stroke();

          context.beginPath();
          context.fillStyle = "#fff8d8";
          context.shadowColor = `hsl(${rocket.hue} 100% 70%)`;
          context.shadowBlur = 18;
          context.arc(rocket.x, rocket.y, 2.8, 0, Math.PI * 2);
          context.fill();

          if (rocket.trailElapsed >= .035) {
            rocket.trailElapsed = 0;
            const life = .18 + Math.random() * .2;
            particles.push({
              x: rocket.x + (Math.random() - .5) * 5,
              y: rocket.y + 5,
              px: rocket.x,
              py: rocket.y + 5,
              vx: (Math.random() - .5) * 42,
              vy: 35 + Math.random() * 80,
              life, remaining: life,
              size: .7 + Math.random() * 1.4,
              hue: rocket.hue,
              glitter: true
            });
          }

          if (progress >= 1) {
            burst(rocket.x, rocket.y, .88 + Math.random() * .32);
            rockets.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const p = particles[i];
          p.px = p.x;
          p.py = p.y;
          p.x += p.vx * delta;
          p.y += p.vy * delta;
          p.vy += 100 * delta;
          p.vx *= Math.pow(.985, delta * 60);
          p.remaining -= delta;
          if (p.remaining <= 0) { particles.splice(i, 1); continue; }
          context.beginPath();
          context.strokeStyle = `hsla(${p.hue} 100% 72% / ${Math.min(1, p.remaining / .25)})`;
          context.lineWidth = p.glitter ? p.size * 1.5 : p.size;
          context.lineCap = "round";
          context.shadowColor = `hsl(${p.hue} 100% 65%)`;
          context.shadowBlur = p.glitter ? 9 : 5;
          context.moveTo(p.px, p.py);
          context.lineTo(p.x, p.y);
          context.stroke();
        }
        context.globalCompositeOperation = "source-over";
        context.shadowBlur = 0;
        frame = requestAnimationFrame(animate);
      }

      function celebrate() {
        cancelAnimationFrame(frame);
        clearInterval(timer);
        frame = 0;
        resizeCanvas();
        particles.length = 0;
        rockets.length = 0;
        if (reducedMotion.matches) {
          burst(card.clientWidth * .28, card.clientHeight * .2, .8);
          burst(card.clientWidth * .72, card.clientHeight * .2, .8);
          burst(card.clientWidth * .5, card.clientHeight * .38, .6);
          context.clearRect(0, 0, card.clientWidth, card.clientHeight);
          for (const p of particles) {
            context.beginPath();
            context.fillStyle = `hsl(${p.hue} 100% 72%)`;
            context.arc(p.x + p.vx * .45, p.y + p.vy * .45, p.size, 0, Math.PI * 2);
            context.fill();
          }
          return;
        }
        clearLaunchDelays();
        launchRocket();
        queueRocket(240);
        queueRocket(480);
        lastTime = 0;
        frame = requestAnimationFrame(animate);
        timer = window.setInterval(() => {
          launchRocket();
        }, 1250);
      }

      function playCardAudio() {
        audio.currentTime = 0;
        audio.play().then(() => {
          musicRetry.hidden = true;
        }).catch((error) => {
          musicRetry.textContent = error.name === "NotAllowedError"
            ? "▶ Tap to play Diwali audio"
            : "▶ Retry Diwali audio";
          musicRetry.hidden = false;
        });
      }

      function openCard() {
        card.classList.add("open");
        inside.inert = false;
        cover.setAttribute("aria-expanded", "true");
        close.hidden = false;
        again.hidden = false;
        stopSong.hidden = false;
        openGift.hidden = false;
        close.focus();
        playCardAudio();
        celebrate();
      }

      function closeCard() {
        card.classList.remove("open");
        inside.inert = true;
        cover.setAttribute("aria-expanded", "false");
        close.hidden = true;
        again.hidden = true;
        stopSong.hidden = true;
        openGift.hidden = true;
        clearInterval(timer);
        clearLaunchDelays();
        cancelAnimationFrame(frame);
        if (giftDialog.open) giftDialog.close();
        audio.pause();
        audio.currentTime = 0;
        musicRetry.hidden = true;
        frame = 0;
        particles.length = 0;
        rockets.length = 0;
        context.clearRect(0, 0, canvas.width, canvas.height);
        cover.focus();
      }

      cover.setAttribute("aria-label", "Tap to open your Diwali greeting card");
      cover.addEventListener("click", openCard);
      close.addEventListener("click", closeCard);
      again.addEventListener("click", celebrate);
      musicRetry.addEventListener("click", playCardAudio);
      stopSong.addEventListener("click", () => {
        audio.pause();
        audio.currentTime = 0;
        musicRetry.hidden = true;
      });
      openGift.addEventListener("click", () => giftDialog.showModal());
      closeGift.addEventListener("click", () => giftDialog.close());
      giftDialog.addEventListener("close", () => {
        giftVideo.pause();
        giftVideo.currentTime = 0;
      });
      window.addEventListener("resize", () => {
        if (card.classList.contains("open")) resizeCanvas();
      }, { passive: true });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          cancelAnimationFrame(frame);
          frame = 0;
          clearInterval(timer);
          clearLaunchDelays();
        } else if (card.classList.contains("open") && !reducedMotion.matches) {
          lastTime = 0;
          frame = requestAnimationFrame(animate);
          launchRocket();
          timer = window.setInterval(launchRocket, 1250);
        }
      });
      window.addEventListener("pagehide", () => {
        clearInterval(timer);
        clearLaunchDelays();
        cancelAnimationFrame(frame);
      }, { once: true });
    })();
  </script>
</body>
</html>
